<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" role="img" aria-label="Planetary Visualization">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A47A3"/>
      <stop offset="1" stop-color="#2B2E4A"/>
    </linearGradient>
  </defs>
  <rect width="160" height="90" rx="12" fill="url(#g)"/>
  <!-- Planet -->
  <circle cx="80" cy="45" r="20" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-width="1.5"/>
  <!-- Scanning lines/Grid on planet -->
  <path d="M 60 45 Q 80 50, 100 45" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
  <path d="M 62 38 Q 80 43, 98 38" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <path d="M 62 52 Q 80 57, 98 52" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
  <path d="M 80 25 Q 85 45, 80 65" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
  <!-- Orbit Ring -->
  <ellipse cx="80" cy="45" rx="35" ry="8" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.8" transform="rotate(-15 80 45)"/>
  <!-- Satellite / Radar waves -->
  <path d="M 125 25 A 8 8 0 0 1 125 39" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 129 21 A 14 14 0 0 1 129 43" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Satellite source node -->
  <circle cx="118" cy="32" r="2.5" fill="#fff"/>
</svg>
